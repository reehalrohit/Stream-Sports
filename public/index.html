<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Live sports matches and authorized streams.">
  <title>Live Matches</title>
  <style>
    :root { color-scheme: dark; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #0b0f19; color: #e2e8f0; margin: 0; padding: 20px; }
    main { max-width: 1000px; margin: 0 auto; }
    h1 { margin: 0 0 20px; }
    .status { margin-bottom: 20px; color: #94a3b8; }
    .stream-card { background: #111827; border: 1px solid #1e293b; border-radius: 10px; padding: 18px; margin-bottom: 18px; }
    .stream-card h2 { font-size: 1.15rem; margin: 0 0 8px; }
    .meta { color: #94a3b8; margin: 0; }
    .badge { display: inline-block; padding: 3px 7px; border-radius: 4px; background: #dc2626; color: #fff; font-size: 11px; font-weight: 700; margin-left: 8px; vertical-align: middle; }
    .watch-btn { display: block; width: 100%; padding: 12px; margin-top: 14px; background: #2563eb; color: #fff; font-weight: 700; border: 0; border-radius: 7px; cursor: pointer; }
    .watch-btn:hover { background: #1d4ed8; }
    .watch-btn:disabled { opacity: .6; cursor: not-allowed; }
    .player-container { margin-top: 14px; }
    iframe { display: block; width: 100%; height: 250px; border: 0; border-radius: 8px; background: #000; }
    .empty { padding: 24px; text-align: center; border: 1px dashed #334155; border-radius: 10px; color: #94a3b8; }
    .error { color: #fca5a5; }
    @media (min-width: 768px) { iframe { height: 500px; } }
  </style>
</head>
<body>
  <main>
    <h1>Live Matches</h1>
    <div id="status" class="status" role="status" aria-live="polite">Loading streams…</div>
    <section id="streams-container" aria-label="Live matches"></section>
  </main>

  <script>
    const container = document.getElementById('streams-container');
    const status = document.getElementById('status');
    let activePlayer = null;

    function setStatus(message, isError = false) {
      status.textContent = message;
      status.classList.toggle('error', isError);
    }

    function createStreamCard(stream) {
      const card = document.createElement('article');
      card.className = 'stream-card';

      const title = document.createElement('h2');
      title.textContent = stream.name;

      const badge = document.createElement('span');
      badge.className = 'badge';
      badge.textContent = 'LIVE';
      title.appendChild(badge);

      const meta = document.createElement('p');
      meta.className = 'meta';
      meta.textContent = `League: ${stream.league} · Viewers: ${stream.viewers}`;

      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'watch-btn';
      button.textContent = '▶ Watch Stream';
      button.setAttribute('aria-expanded', 'false');

      const player = document.createElement('div');
      player.className = 'player-container';
      player.hidden = true;

      button.addEventListener('click', () => {
        if (player.hidden) {
          if (activePlayer && activePlayer !== player) {
            activePlayer.hidden = true;
            activePlayer.replaceChildren();
          }

          const url = new URL(stream.iframe);
          if (url.protocol !== 'https:') return;

          const iframe = document.createElement('iframe');
          iframe.src = url.href;
          iframe.title = `${stream.name} live stream`;
          iframe.allow = 'autoplay; fullscreen; picture-in-picture';
          iframe.allowFullscreen = true;
          iframe.referrerPolicy = 'strict-origin-when-cross-origin';
          iframe.loading = 'lazy';

          player.replaceChildren(iframe);
          player.hidden = false;
          button.setAttribute('aria-expanded', 'true');
          activePlayer = player;
        } else {
          player.hidden = true;
          player.replaceChildren();
          button.setAttribute('aria-expanded', 'false');
          if (activePlayer === player) activePlayer = null;
        }
      });

      card.append(title, meta, button, player);
      return card;
    }

    async function loadStreams() {
      try {
        const response = await fetch('/papi/api/streams', {
          headers: { 'Accept': 'application/json' },
          cache: 'no-store'
        });

        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const data = await response.json();
        container.replaceChildren();

        const streams = (data.streams || []).flatMap(category => category.streams || []);
        if (!data.success || streams.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'empty';
          empty.textContent = 'No live matches are available right now.';
          container.appendChild(empty);
          setStatus('No live matches.');
          return;
        }

        streams.forEach(stream => container.appendChild(createStreamCard(stream)));
        setStatus(`Updated ${new Date().toLocaleTimeString()}`);
      } catch (error) {
        console.error(error);
        setStatus('Unable to load live matches. Please try again.', true);
      }
    }

    loadStreams();
    setInterval(loadStreams, 30000);
  </script>
</body>
</html>
