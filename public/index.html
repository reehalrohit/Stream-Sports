<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Live sports matches and authorized streams."
  >

  <title>Live Matches</title>

  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #0b0f19;
      color: #e2e8f0;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    main {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.8rem;
    }

    .status {
      min-height: 24px;
      color: #94a3b8;
    }

    .status.error {
      color: #fca5a5;
    }

    #refresh {
      width: 100%;
      margin-bottom: 20px;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: #334155;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    #refresh:hover {
      background: #475569;
    }

    #refresh:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .category {
      margin-bottom: 28px;
    }

    .category-title {
      margin: 0 0 12px;
      font-size: 1.1rem;
      color: #cbd5e1;
    }

    .stream-card {
      margin-bottom: 16px;
      padding: 18px;
      background: #111827;
      border: 1px solid #1e293b;
      border-radius: 12px;
    }

    .stream-title {
      margin: 0 0 8px;
      font-size: 1.15rem;
      line-height: 1.4;
    }

    .badge {
      display: inline-block;
      margin-left: 8px;
      padding: 3px 7px;
      border-radius: 4px;
      background: #dc2626;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      vertical-align: middle;
    }

    .meta {
      margin: 0;
      color: #94a3b8;
    }

    .actions {
      display: grid;
      gap: 8px;
      margin-top: 14px;
    }

    button {
      font: inherit;
    }

    .watch-btn,
    .source-btn,
    .close-btn {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 7px;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    .watch-btn {
      background: #2563eb;
    }

    .watch-btn:hover {
      background: #1d4ed8;
    }

    .source-btn {
      background: #334155;
    }

    .source-btn:hover {
      background: #475569;
    }

    .close-btn {
      background: #475569;
    }

    .close-btn:hover {
      background: #64748b;
    }

    .player {
      margin-top: 14px;
    }

    .player-box {
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 8px;
      background: #000;
    }

    iframe {
      width: 100%;
      height: 100%;
      display: block;
      border: 0;
      background: #000;
    }

    .empty {
      padding: 28px 20px;
      border: 1px dashed #334155;
      border-radius: 10px;
      text-align: center;
      color: #94a3b8;
    }

    .notice {
      margin-top: 12px;
      color: #fca5a5;
      font-size: 0.9rem;
    }

    .poster {
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      margin-top: 12px;
      border-radius: 8px;
    }

    @media (min-width: 768px) {
      body {
        padding: 32px;
      }

      h1 {
        font-size: 2rem;
      }

      .actions {
        grid-template-columns: repeat(
          auto-fit,
          minmax(160px, 1fr)
        );
      }
    }
  </style>
</head>

<body>
  <main>
    <header>
      <h1>Live Matches</h1>

      <div
        id="status"
        class="status"
        role="status"
        aria-live="polite"
      >
        Loading live matches…
      </div>
    </header>

    <button
      id="refresh"
      type="button"
    >
      ↻ Refresh
    </button>

    <section
      id="streams"
      aria-label="Live matches"
    ></section>
  </main>

  <script>
    const streamsContainer =
      document.getElementById('streams');

    const statusElement =
      document.getElementById('status');

    const refreshButton =
      document.getElementById('refresh');

    let activePlayer = null;
    let loading = false;

    function setStatus(
      message,
      isError = false
    ) {
      statusElement.textContent =
        message;

      statusElement.classList.toggle(
        'error',
        isError
      );
    }

    function createIframe(
      streamName,
      url
    ) {
      try {
        const parsed =
          new URL(url);

        if (
          parsed.protocol !==
          'https:'
        ) {
          return null;
        }

        const iframe =
          document.createElement(
            'iframe'
          );

        iframe.src =
          parsed.href;

        iframe.title =
          `${streamName} live stream`;

        iframe.allow =
          'autoplay; fullscreen; picture-in-picture';

        iframe.allowFullscreen =
          true;

        iframe.loading =
          'lazy';

        iframe.referrerPolicy =
          'strict-origin-when-cross-origin';

        return iframe;
      } catch {
        return null;
      }
    }

    function closeActivePlayer() {
      if (!activePlayer) {
        return;
      }

      activePlayer.wrapper
        .replaceChildren();

      activePlayer.container.hidden =
        true;

      activePlayer.button.textContent =
        '▶ Watch Stream';

      activePlayer.button
        .setAttribute(
          'aria-expanded',
          'false'
        );

      activePlayer =
        null;
    }

    function showPlayer(
      stream,
      button,
      playerContainer,
      url
    ) {
      closeActivePlayer();

      if (!url) {
        const error =
          document.createElement(
            'div'
          );

        error.className =
          'notice';

        error.textContent =
          'No playable stream URL is currently available.';

        playerContainer
          .replaceChildren(error);

        playerContainer.hidden =
          false;

        return;
      }

      const iframe =
        createIframe(
          stream.name,
          url
        );

      if (!iframe) {
        const error =
          document.createElement(
            'div'
          );

        error.className =
          'notice';

        error.textContent =
          'The stream URL is not a valid HTTPS embed URL.';

        playerContainer
          .replaceChildren(error);

        playerContainer.hidden =
          false;

        return;
      }

      const wrapper =
        document.createElement(
          'div'
        );

      wrapper.className =
        'player-box';

      wrapper.appendChild(
        iframe
      );

      playerContainer
        .replaceChildren(wrapper);

      playerContainer.hidden =
        false;

      button.textContent =
        '✕ Close Stream';

      button.setAttribute(
        'aria-expanded',
        'true'
      );

      activePlayer = {
        button,
        container:
          playerContainer,
        wrapper
      };
    }

    function createStreamCard(
      stream
    ) {
      const card =
        document.createElement(
          'article'
        );

      card.className =
        'stream-card';

      const title =
        document.createElement(
          'h3'
        );

      title.className =
        'stream-title';

      title.textContent =
        stream.name ||
        'Live Match';

      const badge =
        document.createElement(
          'span'
        );

      badge.className =
        'badge';

      badge.textContent =
        'LIVE';

      title.appendChild(
        badge
      );

      const meta =
        document.createElement(
          'p'
        );

      meta.className =
        'meta';

      meta.textContent =
        `League: ${
          stream.league ||
          'Sports'
        } · Viewers: ${
          Number.isFinite(
            Number(stream.viewers)
          )
            ? Number(stream.viewers)
            : 0
        }`;

      if (stream.poster) {
        const poster =
          document.createElement(
            'img'
          );

        poster.className =
          'poster';

        poster.src =
          stream.poster;

        poster.alt =
          `${stream.name} poster`;

        poster.loading =
          'lazy';

        card.appendChild(
          poster
        );
      }

      const actions =
        document.createElement(
          'div'
        );

      actions.className =
        'actions';

      const watchButton =
        document.createElement(
          'button'
        );

      watchButton.type =
        'button';

      watchButton.className =
        'watch-btn';

      watchButton.textContent =
        '▶ Watch Stream';

      watchButton.setAttribute(
        'aria-expanded',
        'false'
      );

      const playerContainer =
        document.createElement(
          'div'
        );

      playerContainer.className =
        'player';

      playerContainer.hidden =
        true;

      watchButton.addEventListener(
        'click',
        () => {
          if (
            activePlayer &&
            activePlayer.button ===
              watchButton
          ) {
            closeActivePlayer();
            return;
          }

          showPlayer(
            stream,
            watchButton,
            playerContainer,
            stream.iframe
          );
        }
      );

      actions.appendChild(
        watchButton
      );

      const sourceList =
        Array.isArray(
          stream.sources
        )
          ? stream.sources
          : [];

      sourceList.forEach(
        (source, index) => {
          if (
            !source ||
            !source.url
          ) {
            return;
          }

          const sourceButton =
            document.createElement(
              'button'
            );

          sourceButton.type =
            'button';

          sourceButton.className =
            'source-btn';

          sourceButton.textContent =
            source.name ||
            `Source ${index + 1}`;

          sourceButton.addEventListener(
            'click',
            () => {
              showPlayer(
                stream,
                watchButton,
                playerContainer,
                source.url
              );
            }
          );

          actions.appendChild(
            sourceButton
          );
        }
      );

      card.append(
        title,
        meta,
        actions,
        playerContainer
      );

      return card;
    }

    function renderStreams(
      categories
    ) {
      closeActivePlayer();

      streamsContainer
        .replaceChildren();

      if (
        !Array.isArray(categories) ||
        categories.length === 0
      ) {
        const empty =
          document.createElement(
            'div'
          );

        empty.className =
          'empty';

        empty.textContent =
          'No live matches are available right now.';

        streamsContainer
          .appendChild(empty);

        return 0;
      }

      let count = 0;

      const fragment =
        document.createDocumentFragment();

      categories.forEach(
        (category) => {
          if (
            !category ||
            !Array.isArray(
              category.streams
            ) ||
            category.streams.length === 0
          ) {
            return;
          }

          const section =
            document.createElement(
              'section'
            );

          section.className =
            'category';

          const heading =
            document.createElement(
              'h2'
            );

          heading.className =
            'category-title';

          heading.textContent =
            category.category ||
            'Sports';

          section.appendChild(
            heading
          );

          category.streams.forEach(
            (stream) => {
              if (!stream) {
                return;
              }

              section.appendChild(
                createStreamCard(
                  stream
                )
              );

              count++;
            }
          );

          fragment.appendChild(
            section
          );
        }
      );

      streamsContainer
        .appendChild(fragment);

      return count;
    }

    async function loadStreams() {
      if (loading) {
        return;
      }

      loading = true;
      refreshButton.disabled =
        true;

      setStatus(
        'Loading live matches…'
      );

      try {
        const response =
          await fetch(
            '/papi/api/streams',
            {
              method: 'GET',
              headers: {
                Accept:
                  'application/json'
              },
              cache: 'no-store'
            }
          );

        if (!response.ok) {
          throw new Error(
            `HTTP ${response.status}`
          );
        }

        const data =
          await response.json();

        if (
          !data ||
          typeof data !== 'object'
        ) {
          throw new Error(
            'Invalid API response'
          );
        }

        const count =
          renderStreams(
            data.streams
          );

        if (data.stale) {
          setStatus(
            `${count} live match${
              count === 1 ? '' : 'es'
            } · cached data`
          );
        } else if (count > 0) {
          setStatus(
            `${count} live match${
              count === 1 ? '' : 'es'
            } · Updated ${
              new Date()
                .toLocaleTimeString()
            }`
          );
        } else {
          setStatus(
            'No live matches right now.'
          );
        }
      } catch (error) {
        console.error(
          'Stream loading error:',
          error
        );

        setStatus(
          'Unable to load live matches. Please try again.',
          true
        );

        if (
          !streamsContainer
            .children.length
        ) {
          const empty =
            document.createElement(
              'div'
            );

          empty.className =
            'empty';

          empty.textContent =
            'The live stream service is currently unavailable.';

          streamsContainer
            .appendChild(empty);
        }
      } finally {
        loading = false;
        refreshButton.disabled =
          false;
      }
    }

    refreshButton.addEventListener(
      'click',
      loadStreams
    );

    loadStreams();

    // Refresh every 60 seconds.
    setInterval(
      loadStreams,
      60000
    );
  </script>
</body>
  </html>
