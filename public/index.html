<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAMITV Streaming</title>
    <style>
        body { font-family: -apple-system, sans-serif; background-color: #0b0f19; color: #e2e8f0; padding: 20px; }
        .stream-card { background-color: #111827; border: 1px solid #1e293b; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .badge { padding: 4px 8px; border-radius: 4px; background-color: #dc2626; color: white; font-size: 12px; font-weight: bold; margin-left: 10px; }
        iframe { width: 100%; height: 500px; border: none; border-radius: 8px; background-color: #000; }
    </style>
</head>
<body>
    <h1>Live Streams</h1>
    <div id="streams-container">Loading streams...</div>

    <script>
        async function loadStreams() {
            try {
                const response = await fetch('/papi/api/streams');
                const data = await response.json();
                
                if (data.success && data.streams) {
                    const container = document.getElementById('streams-container');
                    container.innerHTML = ''; 
                    
                    data.streams.forEach(category => {
                        category.streams.forEach(stream => {
                            container.innerHTML += `
                                <div class="stream-card">
                                    <h2>${stream.name} <span class="badge">${stream.status.toUpperCase()}</span></h2>
                                    <p>League: ${stream.league} | Viewers: ${stream.viewers}</p>
                                    <iframe src="${stream.iframe}" allowfullscreen></iframe>
                                </div>
                            `;
                        });
                    });
                }
            } catch (error) {
                document.getElementById('streams-container').innerText = 'Error loading API.';
            }
        }

        loadStreams();
        setInterval(loadStreams, 60000); 
    </script>
</body>
</html>
